<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Larkin Palm Springs PM&amp;R Hub</title>
<meta name="description" content="Rotation guides, didactics, the block schedule and study materials for the Larkin Palm Springs PM&amp;R residency.">
<link rel="icon" href="https://larkinpscpmr.github.io/favicon.svg" type="image/svg+xml">
<link rel="icon" href="https://larkinpscpmr.github.io/favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="https://larkinpscpmr.github.io/apple-touch-icon.png">
<link rel="manifest" href="https://larkinpscpmr.github.io/manifest.webmanifest">
<meta name="theme-color" content="#0E6B6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PM&amp;R Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1C2B2E;--muted:#5B6668;--soft:#45524F;--sand:#F5F1EA;--line:#E3DDD2;--line2:#ECE6DB;--teal:#0E6B6B;--tealD:#094848;--night:#12343B;--night2:#1E4A52;--sun:#F2B45B;--sunT:#F8E7C6;--sunInk:#6B4A0E;--coralT:#FBE6D8;--coralInk:#9A3A22;--tealT:#DDEFEE;--tealInk:#0B4F4F;--card:#fff;--card2:#F9F7F2;--edge:#CFC7B9;--onNight:#D8E3E1;--onDark:#F5F1EA;--night3:#3C6168;--chip0:#EEE9E0;--past:#F1EEE8;--pastInk:#7A8486;--hover:#EDE7DC;--headerBg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}a:hover{color:var(--tealD)}
h1,h2,h3{font-family:Outfit,sans-serif;margin:0}
.mono{font-family:'IBM Plex Mono',monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header{background:var(--headerBg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:16px}
.brand{font-family:Outfit,sans-serif;font-weight:700;font-size:22px;letter-spacing:-.01em}
.year{font-size:13px;color:var(--muted)}
.grow{flex:1 1 20px}
.search{display:flex;align-items:center;gap:10px;background:var(--sand);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:44px;flex:0 1 360px;min-width:200px}
.search input{border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none;flex:1;min-width:0}
nav{display:flex;gap:2px;overflow-x:auto;padding-top:6px}
nav a{padding:12px 13px;font-weight:500;font-size:15px;color:var(--soft);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
nav a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--teal)}
main{max-width:1200px;margin:0 auto;padding:32px 24px 64px;display:flex;flex-direction:column;gap:24px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:var(--muted)}
.hero{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between}
.hero h1{font-size:clamp(34px,5vw,52px);line-height:1.05;letter-spacing:-.025em;font-weight:700}
.hero h1 span{color:var(--teal)}
.lead{font-size:17px;line-height:1.6;color:var(--soft);max-width:620px;margin:12px 0 0}
.today{background:var(--night);color:var(--onDark);border-radius:18px;padding:20px 24px;flex:0 1 340px}
.today .k{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:var(--sun)}
.today .d{font-family:Outfit,sans-serif;font-weight:600;font-size:26px;margin:4px 0}
.today .s{font-size:15px;color:var(--onNight)}
.banner{background:var(--coralT);border-radius:16px;padding:16px 20px;display:flex;gap:12px}
.banner b{display:block;margin-bottom:2px}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.main{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:24px}
.side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px}
.card h2{font-size:24px;font-weight:600}
.card .sub{font-size:14px;color:var(--muted);margin-top:2px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mini{text-decoration:none;color:var(--ink);background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.mini:hover{border-color:var(--edge)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--tealT);color:var(--tealInk);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:500}
.tag{border-radius:6px;padding:3px 8px;font-family:'IBM Plex Mono',monospace;font-size:12px;white-space:nowrap}
.t-Lecture{background:var(--tealT);color:var(--tealInk)}
.t-Board{background:var(--sunT);color:var(--sunInk)}
.t-Other{background:var(--chip0);color:var(--soft)}
.sess{display:flex;gap:18px;align-items:flex-start}
.date{flex:none;width:72px;background:var(--sunT);border-radius:14px;padding:8px 0;display:flex;flex-direction:column;align-items:center}
.date .a{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--sunInk)}
.date .b{font-family:Outfit,sans-serif;font-weight:700;font-size:28px;line-height:1.1}
.talks{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.talk .t{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600;font-size:16px}
.talk .w{font-size:14px;color:var(--muted)}
.need{color:var(--coralInk);font-weight:600}
.alert{display:block;background:var(--coralT);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.contact{display:flex;flex-direction:column;gap:3px;padding-bottom:12px;border-bottom:1px solid var(--line2)}
.contact:last-child{border-bottom:0;padding-bottom:0}
.contact .r{font-size:13px;color:var(--muted)}.contact .n{font-weight:600}.contact a{font-family:'IBM Plex Mono',monospace;font-size:13px}
.dark{background:var(--night);color:var(--onDark);border:0}
.btn{display:flex;align-items:center;justify-content:space-between;min-height:46px;padding:0 16px;border-radius:12px;font-weight:600;text-decoration:none;border:0;font:inherit;font-weight:600;cursor:pointer}
.btn.sun{background:var(--sun);color:var(--ink)}.btn.night{background:var(--night2);color:var(--onDark)}
.btn.teal{background:var(--teal);color:#fff;display:inline-flex}
.btn.ghost{background:var(--card);border:1px solid var(--edge);color:var(--ink);display:inline-flex;gap:8px}
select{font:inherit;font-size:15px;height:44px;border-radius:10px;border:1px solid var(--edge);padding:0 10px;background:var(--card);color:var(--ink);max-width:100%}
.dark select{background:var(--night2);color:#fff;border-color:var(--night3)}
.page-h{display:flex;flex-direction:column;gap:10px}
.page-h h1{font-size:clamp(32px,4.5vw,44px);letter-spacing:-.02em;font-weight:700}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
dl{margin:0;display:grid;grid-template-columns:92px minmax(0,1fr);row-gap:8px;column-gap:12px;font-size:14px}
dt{color:var(--muted)}dd{margin:0;font-weight:500}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.code{background:var(--sand);border-radius:6px;padding:3px 8px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--soft);flex:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--soft)}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.tablebox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;overflow-x:auto}
.sgrid{min-width:1120px;display:grid;grid-template-columns:190px repeat(12,minmax(0,1fr));gap:5px;font-size:12.5px}
.sgrid .h{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);text-align:center;padding-bottom:4px}
.sgrid .h.now{color:var(--night);font-weight:600}
.sgrid .n{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.sgrid .p{font-family:Outfit,sans-serif;font-weight:600;font-size:15px;color:var(--teal);grid-column:1/-1;padding:10px 0 2px}
.cell{color:#1C2B2E;border-radius:8px;min-height:34px;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px 4px;line-height:1.2;border:1px solid transparent}
.cell.now{box-shadow:inset 0 0 0 2px var(--night);font-weight:600;letter-spacing:-.01em}
.g-rehab{background:#CDE7E5}.g-core{background:#EADFCB}.g-spec{background:#F6D6C4}.g-elec{background:#fff;border-color:#CFC7B9}.g-split{background:#F1ECE3}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:40px;padding:0 14px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--edge)}
.pill.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line2);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .t{font-weight:600;font-size:15px}.li .m{font-size:13px;color:var(--muted)}
.star{color:#B4432A;font-size:12px;font-weight:600}
.empty{color:var(--muted);font-size:15px;text-align:center;padding:24px 8px}
.me{display:flex;flex-direction:column;gap:10px}
.me .now{font-family:Outfit,sans-serif;font-size:22px;font-weight:600}
.gate{max-width:420px;margin:12vh auto;padding:0 24px}
.gate input{background:var(--card);color:var(--ink);width:100%;height:48px;border-radius:12px;border:1px solid var(--edge);padding:0 14px;font:inherit;font-size:16px;margin:16px 0 12px}
.load{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted);font-size:16px}
.results{display:none}
.results.on{display:flex}
.gwrap{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.gside{flex:1 1 240px;max-width:300px;display:flex;flex-direction:column;gap:18px}
.gside .grp{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.gside a{display:block;padding:8px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.35}
.gside a:hover{background:var(--hover)}
.gside a.on{background:var(--tealT);color:var(--tealInk);font-weight:600}
.gmain{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}
.back{font-weight:600;text-decoration:none}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.fk{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.fv{font-size:16px;line-height:1.5}
.fv a{font-weight:600}
.hr{border-top:1px solid var(--line2)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
@media(max-width:640px){.strip{display:flex;overflow-x:auto;padding-bottom:4px}.seg{flex:0 0 120px}}
.seg{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.seg .sl{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;margin-bottom:2px}
.seg.past{background:var(--past);color:var(--pastInk)}
.seg.now{background:var(--tealT);color:var(--tealInk);box-shadow:inset 0 0 0 2px var(--teal);font-weight:600}
.seg.next{background:var(--sunT);color:var(--sunInk)}
.seg .none{font-style:italic;opacity:.8;font-weight:400}
.doc{font-size:16px;line-height:1.65;color:var(--ink)}
.doc h1,.doc h2{font-family:Outfit,sans-serif;font-size:26px;font-weight:600;margin:28px 0 10px}
.doc h3,.doc h4{font-family:Outfit,sans-serif;font-size:19px;font-weight:600;margin:22px 0 8px}
.doc > :first-child{margin-top:0}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{margin:0 0 14px;padding-left:22px}
.doc li{margin:4px 0}
.doc table{border-collapse:collapse;width:100%;margin:6px 0 18px;font-size:15px;display:block;overflow-x:auto}
.doc td,.doc th{border:1px solid var(--line);padding:10px 12px;vertical-align:top}
.doc tr td:first-child{background:var(--card2);font-weight:600;width:34%}
.doc img{max-width:100%;height:auto;border-radius:10px}
.doc a{word-break:break-word}
.skel{height:14px;border-radius:7px;background:var(--chip0);margin:10px 0}
.edit{font-size:13px;color:var(--muted)}
.gpick{display:none}
@media (max-width:860px){.gside{display:none}.gpick{display:flex;flex-direction:column;gap:6px;flex-basis:100%}.gpick span{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:var(--muted)}.gpick select{min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;font:inherit;font-size:16px;color:var(--ink)}}
@media (max-width:640px){header{position:static}.top{gap:10px}.brand{font-size:18px}.year{display:none}.search{flex:1 1 100%;order:3}.grow{display:none}.themebox{order:2;margin-left:auto}.themebtn{width:40px;height:40px}.top svg[width="40"]{width:34px;height:34px}.brand{font-size:17px}.hero h1 br{display:none}.sess{gap:12px}.date{width:60px}.card{padding:18px}main{padding:24px 16px 48px}.wrap{padding:0 16px}}

/* ---------- Colour themes (each viewer can pick one; chiefs set the default in Settings) ---------- */
[data-theme="sunset"]{--teal:#B5523B;--tealD:#8E3D2B;--night:#3A2420;--night2:#553630;--night3:#7A5047;--sun:#F2B45B;--tealT:#F6E0D8;--tealInk:#7A2F1E;--sand:#F8F1EA;--line:#E8DDD2;--line2:#F0E7DD;--card2:#FBF6F1;--hover:#F0E4D8}
[data-theme="ocean"]{--teal:#1F5FA8;--tealD:#174A84;--night:#13294B;--night2:#1F3A63;--night3:#3A5784;--sun:#F2C14E;--tealT:#DCE8F6;--tealInk:#123E70;--sand:#F2F5F9;--line:#DCE3EC;--line2:#E7ECF2;--card2:#F7F9FC;--hover:#E4EAF2;--past:#EBEFF4}
[data-theme="grove"]{--teal:#2F6B3A;--tealD:#24532D;--night:#1E3324;--night2:#2C4A34;--night3:#4A6B52;--sun:#E9B949;--tealT:#DEEDDF;--tealInk:#1F4D28;--sand:#F4F3EC;--line:#E0E0D3;--line2:#EAEAE0;--card2:#F9F9F4;--hover:#E8E8DC}
[data-theme="night"]{color-scheme:dark;--ink:#E8EEEC;--muted:#9AABAA;--soft:#B9C6C4;--sand:#0F1A1C;--line:#26383B;--line2:#1F3033;--teal:#4FB3AE;--tealD:#7FCBC6;--night:#0A1315;--night2:#18292C;--night3:#2E4649;--sun:#F2B45B;--sunT:#3B3020;--sunInk:#F2CF8F;--coralT:#3B2520;--coralInk:#F2B4A0;--tealT:#16393A;--tealInk:#A8E0DC;--card:#152326;--card2:#1A2B2E;--edge:#33494C;--headerBg:#122023;--chip0:#22343A;--past:#1C2A2D;--pastInk:#7F9190;--hover:#1F3134}
.themebox{position:relative;flex:none}
.themebtn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--sand);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--soft)}
.themes{position:absolute;right:0;top:52px;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:6px;min-width:220px}
.themes[hidden]{display:none}
.themes .k{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.themes button{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:10px;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;text-align:left}
.themes button:hover{background:var(--hover)}
.themes button.on{background:var(--tealT);color:var(--tealInk);font-weight:600}
.themes .sw2{width:22px;height:22px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.pres{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--night2);padding-top:12px}
.pres .k{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:var(--sun)}
.pres .it{background:var(--night2);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
.pres .it b{display:block;color:#fff;font-size:15px}
.pres .soon{color:var(--sun);font-weight:600}
[data-theme="night"] .btn.teal,[data-theme="night"] .pill.on{color:#0A1315}
.calbox{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--night2);padding-top:12px}
.calbox .k{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:var(--sun)}
.seg3{display:flex;background:var(--night2);border-radius:10px;padding:3px;gap:3px}
.seg3 button{flex:1;min-height:34px;border:0;border-radius:8px;background:transparent;color:var(--onNight);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.seg3 button.on{background:var(--sun);color:#1C2B2E}
.calbtns{display:flex;flex-direction:column;gap:8px}
.calnote{font-size:12.5px;line-height:1.45;color:var(--onNight)}
.copied{color:var(--sun);font-weight:600}
.fresh{font-size:12px;color:var(--muted);text-align:center;font-family:'IBM Plex Mono',monospace}
.cd{display:flex;flex-direction:column;gap:12px}
.cd .big{display:flex;align-items:baseline;gap:10px}
.cd .num{font-family:Outfit,sans-serif;font-weight:700;font-size:44px;line-height:1;color:var(--teal)}
.cd .unit{font-size:14px;color:var(--muted)}
.cd .ev{font-weight:600;font-size:16px}
.cd .row2{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding-top:10px;border-top:1px solid var(--line2)}
.cd .row2 b{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--teal);white-space:nowrap}
.ql{display:flex;flex-direction:column;gap:2px}
.ql .cat{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--muted);margin:8px 0 2px}
.ql .cat:first-child{margin-top:0}
.ql a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;margin:0 -10px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500;font-size:15px}
.ql a:hover{background:var(--hover)}
.ql a small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.ql a span.ar{color:var(--teal);flex:none}
.party{background:var(--sunT);border-radius:16px;padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.party .lab{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:var(--sunInk);flex:none}
.party .it{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.party .it em{font-style:normal;color:var(--muted);font-weight:400}
.wl{display:flex;flex-direction:column}
.wl .w1{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line2);flex-wrap:wrap}
.wl .w1:first-child{border-top:0;padding-top:0}
.wl .w1 .n{font-weight:600}.wl .w1 .d{font-size:14px;color:var(--muted)}
.sugg textarea{width:100%;min-height:140px;border-radius:12px;border:1px solid var(--edge);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:12px;resize:vertical}

<script>
/* Data link. Inside Google Apps Script the page already has google.script.run.
   On GitHub (larkinpscpmr.github.io) this stands in for it and talks to the same
   Apps Script web app, which reads and writes the Hub Data sheet. */
(function(){
  if (window.google && google.script && google.script.run) return;
  var API_URL = 'https://script.google.com/macros/s/AKfycbw5_wuu7uNnzlj0n8NKzDCX6wml1hOyQeMA-zMfOVBUYxeWci9v4kKQTdeCrdhfYnHz3A/exec';
  var WRITES = { submitSuggestion: 1, wellnessRespond: 1, wellnessIdea: 1, wellnessVote: 1 };
  function call(fn, args, ok, fail){
    var req = WRITES[fn]
      ? fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      : fetch(API_URL + '?api=' + encodeURIComponent(fn) + '&args=' + encodeURIComponent(JSON.stringify(args)) + '&_=' + Date.now());
    req.then(function(r){ if (!r.ok) throw new Error('The Hub could not reach Google (' + r.status + ')'); return r.json(); })
       .then(function(j){ if (j.ok) { if (ok) ok(j.result); } else if (fail) fail(new Error(j.error || 'Request failed')); })
       .catch(function(e){ if (fail) fail(e); });
  }
  function runner(){
    var ok = null, fail = null, p;
    p = new Proxy({}, { get: function(_, k){
      if (k === 'withSuccessHandler') return function(f){ ok = f; return p; };
      if (k === 'withFailureHandler') return function(f){ fail = f; return p; };
      return function(){ call(String(k), Array.prototype.slice.call(arguments), ok, fail); };
    }});
    return p;
  }
  window.google = { script: { get run(){ return runner(); } } };
})();
</script>

  list.forEach(function(d){ if(!by[d.key]){by[d.key]=[];order.push(d.key);} by[d.key].push(d); });
  if(!order.length) return '<div class="empty">No sessions scheduled.</div>';
  return order.map(function(k){ var f=by[k][0];
    return '<div class="sess"><div class="date"><div class="a">'+f.dow+'</div><div class="b">'+f.day+'</div><div class="a">'+f.mon+'</div></div><div class="talks">'+
      by[k].map(function(t){ var who = t.presenter ? esc(nice(t.presenter))+(isMe(t.presenter)?'<span class="you">You</span>':'') : (t.type==='No session'||t.type==='Self-study' ? '' : '<span class="need">Presenter needed</span>');

}

var GROUP_ORDER = ['Inpatient rehab','Consults, Ortho, SNF','Specialty','Elective'];
var GUIDES = {};
function guideView(code){
  var r = D.rotations.filter(function(x){return x.code.toLowerCase()===String(code).toLowerCase();})[0];
  if (!r) return rotationsGrid();
  // sidebar grouped by category
  var groups = {};
  D.rotations.forEach(function(x){ var g = x.group || 'Other'; (groups[g]=groups[g]||[]).push(x); });
  var gnames = Object.keys(groups).sort(function(a,b){ var ia=GROUP_ORDER.indexOf(a), ib=GROUP_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b); });
  var side = '<nav class="gside" aria-label="Rotation guides">'+gnames.map(function(g){ return '<div><div class="grp">'+esc(g)+'</div>'+groups[g].map(function(x){ return guideLink(x.code, esc(x.name), x===r?'on':''); }).join('')+'</div>'; }).join('')+'</nav>';
  side += '<label class="gpick"><span>JUMP TO ROTATION</span><select onchange="go(\'rotations/\'+this.value)">'+gnames.map(function(g){ return '<optgroup label="'+esc(g)+'">'+groups[g].map(function(x){ return '<option value="'+esc(x.code)+'"'+(x===r?' selected':'')+'>'+esc(x.name)+'</option>'; }).join('')+'</optgroup>'; }).join('')+'</select></label>';
  // facts
  var locs = [];
  if (r.loc1) locs.push(r.map1 ? link(r.map1, esc(r.loc1)) : esc(r.loc1));
  if (r.loc2) locs.push(r.map2 ? link(r.map2, esc(r.loc2)) : esc(r.loc2));
  var fact = function(k,v){ return '<div><div class="fk">'+k+'</div><div class="fv">'+(v||'—')+'</div></div>'; };
  var facts = '<div class="facts">'+fact('Schedule code','<span class="code" style="font-size:13px">'+esc(r.code)+'</span>')+fact('PGY level',esc(r.pgyLevel))+fact(locs.length>1?'Locations':'Location',locs.join('<br>'))+
    fact('Key attending'+(String(r.attending).indexOf(',')>0?'s':''),esc(r.attending))+fact('Arrival time',esc(r.arrival))+(r.reviewed?fact('Last reviewed',esc(r.reviewed)):'')+'</div>';
  var onNow = r.onNowFull.length ? r.onNowFull.map(function(p){ return '<span style="white-space:nowrap">'+esc(nice(p.name))+(p.pgy?' <span style="color:var(--muted)">('+esc(p.pgy)+')</span>':'')+'</span>'; }).join(', ') : '<span style="color:var(--muted)">No residents this block</span>';
  // year strip: merge consecutive months with the same people
  var segs = [], cur = D.schedule.current;
  D.schedule.months.forEach(function(m,i){
    var ppl = (r.byMonth[i]||[]).slice().sort(); var key = ppl.join('|');
    var last = segs[segs.length-1];
    var state = cur<0 ? 'next' : (i<cur?'past':(i===cur?'now':'next'));
    if (last && last.key===key && last.state===state) { last.to=m; } else { segs.push({from:m,to:m,key:key,ppl:ppl,state:state}); }
  });
  var strip = '<div class="strip">'+segs.map(function(s){ return '<div class="seg '+s.state+'"><div class="sl">'+esc((s.from===s.to?s.from:s.from+'–'+s.to).toUpperCase())+(s.state==='now'?' · NOW':'')+'</div>'+(s.ppl.length?s.ppl.map(function(p){return '<div>'+esc(p)+'</div>';}).join(''):'<div class="none">No one</div>')+'</div>'; }).join('')+'</div>';
  var cached = GUIDES[r.code];
  var body = cached ? guideBody(r, cached) : '<div id="guidebody"><div class="skel" style="width:40%;height:22px"></div><div class="skel"></div><div class="skel" style="width:92%"></div><div class="skel" style="width:85%"></div><div class="skel" style="width:60%"></div></div>';
  if (!cached) setTimeout(function(){ fetchGuide(r); }, 0);
  setTimeout(function(){ var n=document.querySelector('.strip .seg.now'), st=n&&n.parentNode; if(n&&st.scrollWidth>st.clientWidth) st.scrollLeft=n.offsetLeft-st.offsetLeft-8; }, 0);
  return '<div class="gwrap">'+side+'<div class="gmain">'+
    '<a class="back" href="#rotations" onclick="go(\'rotations\');return false;">← All rotation guides</a>'+
    '<div class="page-h"><div class="eyebrow">'+esc((r.group||'Rotation').toUpperCase())+'</div><h1>'+esc(r.name)+'</h1>'+(r.expectations?'<p class="lead" style="margin:0">'+esc(r.expectations)+'</p>':'')+'</div>'+
    '<section class="card" style="gap:20px">'+facts+'<div class="hr"></div><div><div class="fk">On this rotation in '+esc(D.blockLabel)+'</div><div class="fv">'+onNow+'</div></div>'+strip+'</section>'+
    onboardCard(r)+'<section class="card"><div id="guidebody-wrap">'+body+'</div></section></div></div>';
}
function richText(t){
  var out = [], list = [];
  var linkify = function(x){ return esc(x).replace(/(https?:\/\/[^\s<]+)/g, function(u){ return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'; }); };
  String(t||'').split(/\r?\n/).forEach(function(line){
    var l = line.trim();
    if (/^[-•*]\s+/.test(l)) { list.push('<li>'+linkify(l.replace(/^[-•*]\s+/, ''))+'</li>'); return; }
    if (list.length) { out.push('<ul>'+list.join('')+'</ul>'); list = []; }
    if (l) out.push('<p>'+linkify(l)+'</p>');
  });
  if (list.length) out.push('<ul>'+list.join('')+'</ul>');
  return out.join('');
}

}
function onboardCard(r){
  var g = GUIDES[r.code] || {};
  var hasText = !!(r.onboarding||'').trim(), files = g.onboard || [];
  var me = store('hubme'), done = me && store(onbKey(r)) === '1';
  var hide = !hasText && !files.length ? ' style="display:none"' : '';
  var codeArg = esc(r.code).replace(/'/g,"\\'");
  if (done) return '<section class="card onb" id="onbcard"'+hide+'><div class="fold"><div><h2 style="font-size:22px">Before you start</h2><div class="sub">One-time onboarding for this site</div></div><span class="okp">✓ You’ve done this</span></div><button type="button" class="linkbtn" style="align-self:flex-start" onclick="setOnb(\''+codeArg+'\',\'0\')">Show it again</button><div id="onbfiles" hidden></div></section>';
  return '<section class="card onb" id="onbcard"'+hide+'><div><h2>Before you start</h2><div class="sub">One-time onboarding for this site. You usually only do this the first time you rotate here.</div></div>'+
    (hasText?'<div class="txt">'+richText(r.onboarding)+'</div>':'')+'<div id="onbfiles">'+onbFiles(files)+'</div>'+
    (me?'<button type="button" class="btn ghost" style="align-self:flex-start" onclick="setOnb(\''+codeArg+'\',\'1\')">✓ I’ve already done this onboarding</button>':'')+'</section>';
}
function guideFiles(g){
  var F = g.files||[]; if (!F.length) return '';
  return '<div class="gfiles"><h2 style="font-size:22px">Note templates &amp; files</h2><div class="sub" style="margin:2px 0 8px">Open, then File → Make a copy to use your own version.</div><div class="list">'+F.map(function(f){
    return '<div class="li"><div><div class="t">'+esc(f.name)+'</div><div class="m">'+esc(f.type)+' · updated '+esc(f.updated)+'</div></div>'+link(f.url,'Open ↗','btn ghost')+'</div>'; }).join('')+'</div></div>';
}
function guideBody(r, g){
  var files = guideFiles(g);
  if (g.error === 'export' || (!g.html && r.hasGuide)) return '<div class="empty">The guide could not be loaded right now. Refresh the page in a minute.</div>'+files;
  if (!g.html) return '<div class="empty">This guide has not been written yet.</div>'+files;
  return '<div class="doc">'+g.html+'</div>'+(g.updated?'<div class="edit" style="margin-top:16px">Guide updated '+esc(g.updated)+'</div>':'')+files;
}
function fetchGuide(r){
  google.script.run.withSuccessHandler(function(json){
    var g = JSON.parse(json); GUIDES[r.code] = g;
    var el = document.getElementById('guidebody-wrap');
    if (el && VIEW==='rotations' && SUB.toLowerCase()===r.code.toLowerCase()) {
      el.innerHTML = guideBody(r, g);
      var oc = document.getElementById('onbcard'), of = document.getElementById('onbfiles');
      if (of && !of.hidden) of.innerHTML = onbFiles(g.onboard);
      if (oc && g.onboard && g.onboard.length) oc.style.display = '';
    }
  }).withFailureHandler(function(){
    var el = document.getElementById('guidebody-wrap');
    if (el) el.innerHTML = '<div class="empty">The guide could not be loaded right now. Refresh the page in a minute.</div>';
  }).getGuide(r.code, store('hubpass')||'');
}
function rotations(){ return SUB ? guideView(SUB) : rotationsGrid(); }
function rotationsGrid(){
  return '<section class="page-h"><div class="eyebrow">'+D.rotations.length+' ROTATIONS</div><h1>Rotation Guides</h1><p class="lead" style="margin:0">Where to go, when to arrive, who to report to and what\'s expected. Each guide is written by the residents who rotated there before you.</p></section>'+
    '<div class="rgrid">'+D.rotations.map(rotationCard).join('')+'</div>';
}

function studyItem(x){
  return '<div class="li"><div style="min-width:0"><div class="t">'+(x.recommended?'<span class="star">★ Recommended</span> ':'')+esc(x.title)+'</div><div class="m">'+[x.type,x.topic,x.by,x.added].filter(Boolean).map(esc).join(' · ')+'</div>'+(x.description?'<div class="m" style="margin-top:4px">'+esc(x.description)+'</div>':'')+'</div>'+link(x.url,'Open','btn ghost')+'</div>';
}
function study(){
  var items = D.study.filter(function(x){return TOPIC==='All'||x.topic===TOPIC;});
  var pills = ['All'].concat(D.topics).map(function(t){return '<button type="button" class="pill'+(t===TOPIC?' on':'')+'" onclick="TOPIC=\''+t.replace(/'/g,"\\'")+'\';render()">'+esc(t)+'</button>';}).join('');
  var lib = items.length ? '<div class="list">'+items.map(studyItem).join('')+'</div>' : '<div class="empty">'+(D.study.length?'Nothing under this topic yet.':'The library is ready for its first resource.')+'</div>';
  var slides = D.lectureSlides.length ? '<div class="list">'+D.lectureSlides.map(function(d){return '<div class="li"><div><div class="t">'+esc(d.title)+'</div><div class="m">'+esc(d.long)+' · '+esc(nice(d.presenter))+'</div></div>'+link(d.slides,'Slides','btn ghost')+'</div>';}).join('')+'</div>' : '<div class="empty">Lecture slides appear here once presenters add them.</div>';
  return '<section class="page-h"><div class="eyebrow">SHARED LIBRARY · OPEN TO ALL RESIDENTS</div><h1>Study Materials</h1><p class="lead" style="margin:0">Slides, articles, videos and question banks, tagged by topic. Upload once and it is filed in the program Drive for everyone.</p></section>'+
    '<div class="cols"><div class="main"><div class="pills">'+pills+'</div><section class="card"><h2>Library</h2>'+lib+'</section><section class="card"><h2>Recent lecture slides</h2>'+slides+'</section></div>'+
    '<aside class="side"><section class="card dark"><h2 style="font-size:22px">Add a resource</h2><p style="margin:0;font-size:15px;line-height:1.5;color:var(--onNight)">Upload a file or share a link. Pick a topic so others can find it.</p>'+(D.uploadForm?'<a class="btn sun" href="'+esc(D.uploadForm)+'" target="_blank" rel="noopener">Open the upload form <span aria-hidden="true">→</span></a>':'<div class="sub" style="color:var(--onNight)">Upload form not set up yet.</div>')+'</section></aside></div>';
}

function fileList(list, emptyText){
  return list.length ? '<div class="list">'+list.map(function(f){return '<div class="li"><div><div class="t">'+esc(f.name)+'</div><div class="m">Updated '+esc(f.updated)+'</div></div>'+link(f.url,'Open','btn ghost')+'</div>';}).join('')+'</div>' : '<div class="empty">'+emptyText+'</div>';
}
function policies(){
  return '<section class="page-h"><h1>Policies</h1><p class="lead" style="margin:0">Program policies and advice from senior residents. Chiefs add files to the Policies and PGY Advice folders in the program Drive.</p></section>'+
   '<div class="cols"><div class="main"><section class="card"><h2>Policies</h2>'+fileList(D.policies,'No policies uploaded yet.')+'</section></div><aside class="side"><section class="card"><h2 style="font-size:22px">PGY advice</h2>'+fileList(D.advice,'No advice documents yet.')+'</section></aside></div>';
}

function searchView(){
  var q = Q.toLowerCase(), hit = function(){ return Array.prototype.some.call(arguments,function(s){return String(s||'').toLowerCase().indexOf(q)>=0;}); };
  var rots = D.rotations.filter(function(r){return hit(r.name,r.code,r.attending,r.loc1,r.loc2)||r.onNow.some(function(p){return hit(p);});});
  var ppl = D.people.filter(function(p){return hit(p.name,p.short);});
  var did = D.upcoming.concat(D.past).filter(function(d){return hit(d.title,d.presenter,d.theme);});
  var st = D.study.filter(function(x){return hit(x.title,x.topic,x.type,x.description,x.by);});
  var none = !rots.length && !ppl.length && !did.length && !st.length;
  return '<section class="page-h"><div class="eyebrow">SEARCH</div><h1>Results for “'+esc(Q)+'”</h1></section>'+(none?'<div class="card"><div class="empty">Nothing matched. Try a rotation, a resident or a lecture topic.</div></div>':'')+
    (ppl.length?'<section class="card"><h2>Residents</h2><div class="list">'+ppl.map(function(p){return '<div class="li"><div><div class="t">'+esc(p.name)+'</div><div class="m">'+esc(p.pgy)+'</div></div><div class="m">Now: <b>'+esc(p.current.join(' + ')||'—')+'</b> · Next: '+esc(p.next.join(' + ')||'—')+'</div></div>';}).join('')+'</div></section>':'')+
    (rots.length?'<div class="rgrid">'+rots.map(rotationCard).join('')+'</div>':'')+
    (did.length?'<section class="card"><h2>Didactics</h2><div class="list">'+did.map(function(d){return '<div class="li"><div><div class="t">'+esc(d.title)+'</div><div class="m">'+esc(d.long)+' · '+esc(nice(d.presenter))+'</div></div>'+(d.slides?link(d.slides,'Slides','btn ghost'):'')+'</div>';}).join('')+'</div></section>':'')+
    (st.length?'<section class="card"><h2>Study materials</h2><div class="list">'+st.map(studyItem).join('')+'</div></section>':'');
}

applyTheme();
load();
</script>
</body>
</html>
